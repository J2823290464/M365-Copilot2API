# docker-compose.yml — M365 Copilot2API
# 复制 .env.example 为 .env 并按需修改后再启动。
#
#   cp .env.example .env
#   mkdir -p data secrets
#   printf '%s' 'your-strong-password' > secrets/m365_admin_password
#   docker compose up -d --build

services:
  m365-copilot2api:
    build:
      context: .
      args:
        VERSION: ${M365_VERSION:-dev}
        COMMIT: ${M365_COMMIT:-unknown}
        BUILD_TIME: ${M365_BUILD_TIME:-unknown}
    image: m365-copilot2api:latest
    container_name: m365-copilot2api
    restart: unless-stopped
    ports:
      - "${M365_DOCKER_PORT:-127.0.0.1:4141}:4141"
    env_file:
      - path: .env
        required: false
    environment:
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: /run/secrets/m365_admin_password
      M365_REQUIRE_STRONG_ADMIN_PASSWORD: "1"
      M365_CHAT_TIMEOUT_SECONDS: "120"
      M365_IMAGE_TIMEOUT_SECONDS: "150"
      M365_PUBLIC_IDENTITY_POLICY: "${M365_PUBLIC_IDENTITY_POLICY:-false}"
    volumes:
      - ./data:/data
      - ./secrets/m365_admin_password:/run/secrets/m365_admin_password:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4141/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"